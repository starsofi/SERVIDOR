<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Series Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎬 Explorador de Séries</h1>
        <p class="subtitle">Consumindo a nossa própria API em Node.js</p>

        <div class="serie-area">
            <img src="" alt="Personagem da Série" id="serieImage">
            <div id="serieName"></div>
        </div>

        <div class="controls">
            <button id="randomBtn">🎲 Série Aleatória</button>
        </div>

        <div class="search">
            <input
                type="text"
                id="serieInput"
                placeholder="Digite uma série (ex: stranger things, smallville)"
            >
            <button id="searchBtn">🔍 Buscar</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
